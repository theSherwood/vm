# Deploy the SVM playground to GitHub Pages.
#
# The playground (`browser/web/play.html`) runs SVM guests **client-side**: the bytecode interpreter
# compiled to wasm, driving SVM-text kernels across real Web Workers and real C/C++ guests (Lua,
# SQLite) via the LLVM on-ramp. It needs `crossOriginIsolated` (SharedArrayBuffer for the shared
# WebAssembly.Memory) — which Pages can't grant via headers, so the page ships a `coi-serviceworker`
# that re-adds COOP/COEP on the client.
#
# This job reproduces the `browser-real` CI build (the threads engine) + the on-ramp asset build, then
# assembles a static site that preserves the `browser/` layout (so the page's `import.meta.url`-relative
# paths resolve under the `/<repo>/` project-site base) and deploys it.
name: pages

on:
  # Deploy on a cadence, NOT per-merge. A per-push deploy is superseded (cancelled while still queued)
  # by the next merge before it can win a runner — so under a burst of merges the deploy job starves
  # (it never gets scheduled) and the published site goes stale for hours (ISSUES.md I75; observed
  # 0/30 completed Pages runs, one queued 8 h with zero jobs ever scheduled). A scheduled run instead
  # gets a full interval to grab a runner, merge-independent; `cancel-in-progress: false` then lets it
  # finish once it starts. The `gate` job skips the heavy build when `main` is unchanged since the last
  # deploy, so most scheduled ticks are a ~10 s no-op. Merges still land within one interval; a
  # `workflow_dispatch` deploys on demand (and always builds).
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # on-demand deploy / feature-branch preview (bypasses the unchanged-gate)

# One in-flight deploy at a time; don't cancel a running one (a half-published site is worse than a
# slightly stale one) — this is exactly what lets a scheduled run finish once it wins a runner.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # The Postgres the playground ships. One source of truth on purpose: it keys the build-input cache
  # *and* is read by build-pg-assets.mjs. If those two ever disagree, a bump would hit the old
  # version's cached bitcode + cluster, skip the rebuild, and ship the old Postgres — silently.
  # Keep in step with the same var in ci.yml, which shares this cache key.
  SVM_PG_VER: "17.5"

jobs:
  # Cheap change-detector (~10 s, easy to schedule even under contention): compare the published commit
  # — a `DEPLOYED_SHA` marker the assemble step writes into the site root — against this run's HEAD, and
  # skip the heavy build+deploy when they match, so the 30-min schedule doesn't rebuild+republish
  # identical content. A `workflow_dispatch` always proceeds. On any doubt (site unreachable, no marker)
  # it defaults to building — fail-safe toward publishing, never toward a silent stale skip.
  gate:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - id: check
        run: |
          live=$(curl -fsS https://thesherwood.github.io/vm/DEPLOYED_SHA 2>/dev/null || echo none)
          echo "published=$live head=$GITHUB_SHA event=${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$live" != "$GITHUB_SHA" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "site already at $GITHUB_SHA — skipping build" >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Nightly + rust-src for the threads engine (shared memory + atomics needs `-Z build-std`), and
      # LLVM/clang 18 for the on-ramp assets (clang → bitcode, llvm-dis → .ll for the reader).
      # flex/bison are Postgres's own build-time scanner/parser generators — needed only on a cold
      # Postgres input cache, where build-pg-assets.mjs compiles it from source.
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with: { components: rust-src }
      # Three workspaces: `browser` (the wasm engine), the root (svm-run's `prep_svmb`/`build_image`),
      # and the workspace-excluded `crates/svm-llvm` (`svm-llvm-translate`). The latter two build the
      # Postgres regenerate half below; caching them is what keeps a warm run's re-translate at ~30s
      # instead of a release rebuild of the translator on every run.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            browser
            .
            crates/svm-llvm
      - name: install LLVM/clang 18 (on-ramp build tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 clang-18 flex bison
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      # The threads engine — the exact `browser-real` recipe (shared, imported memory + the TLS
      # exports the Workers call). Output: browser/target/wasm32-unknown-unknown/release/svm_browser.wasm
      - name: build threads wasm engine
        working-directory: browser
        run: |
          rustup target add wasm32-unknown-unknown --toolchain nightly
          RUSTFLAGS="-Ctarget-feature=+atomics,+bulk-memory,+mutable-globals \
            -Clink-arg=--shared-memory -Clink-arg=--import-memory -Clink-arg=--max-memory=1073741824 \
            -Clink-arg=--export=__stack_pointer -Clink-arg=--export=__tls_base \
            -Clink-arg=--export=__tls_size -Clink-arg=--export=__tls_align \
            -Clink-arg=--export=__wasm_init_tls" \
            cargo +nightly build -Z build-std=std,panic_abort --release --lib --target wasm32-unknown-unknown

      # The on-ramp .svmb assets (hello + SQLite Phase A) at --host-page 65536 (the wasm page). The
      # committed hello_c.svmb is regenerated too; SQLite's amalgamation is fetched-and-cached.
      - name: build on-ramp assets
        working-directory: browser
        run: node build-onramp-assets.mjs

      # The chibicc self-host closure image (chibicc_selfhost.img) — chibicc's own cc1 TU sources + the
      # glibc header closure chibicc.h pulls, seeded so the "chibicc compiles its own source" card can
      # run chibicc.svmb --emit-object over them in-browser. Builds a native chibicc for `-M` closure
      # discovery. Fail-soft (MAY_BE_ABSENT): a build hiccup degrades the card to a build hint, no 404.
      - name: build self-host closure image
        working-directory: browser
        run: node build-selfhost-assets.mjs || echo "self-host image skipped"

      # PostgreSQL playground artifacts — regenerated from source so they never drift from the code.
      # The two CODE-INDEPENDENT inputs (whole-program bitcode + initdb'd cluster) are cached, keyed on
      # the Postgres version + the shim/build-script sources; the CODE-COUPLED outputs
      # (postgres_resolved.svmb + pgdata.img) are always regenerated by build-pg-assets.mjs into
      # web/assets/. A cache hit skips the ~10-15 min cold build and just re-translates + re-encodes.
      - name: cache Postgres build inputs
        uses: actions/cache@v4
        with:
          path: |
            /tmp/svm_pg_cache/postgres_shimmed.bc
            /tmp/svm_pg_cache/pgdata
          key: pg-inputs-v1-${{ env.SVM_PG_VER }}-${{ hashFiles('crates/svm-run/demos/postgres/**') }}
      # SVM_PG_VER comes from the workflow env above — the same value that keyed the cache.
      - name: build + stage Postgres artifacts
        working-directory: browser
        env:
          SVM_PG_CACHE: /tmp/svm_pg_cache
        run: node build-pg-assets.mjs

      # Assemble the site, preserving the browser/ structure so the relative paths resolve under the
      # project-site subpath. Root index.html redirects to the playground.
      - name: assemble site
        working-directory: browser
        run: |
          SITE="$GITHUB_WORKSPACE/_site"
          mkdir -p "$SITE/web/assets" "$SITE/target/wasm32-unknown-unknown/release"
          cp -r web/. "$SITE/web/"
          cp target/wasm32-unknown-unknown/release/svm_browser.wasm "$SITE/target/wasm32-unknown-unknown/release/"
          cat > "$SITE/index.html" <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8" />
          <meta http-equiv="refresh" content="0; url=web/play.html" />
          <title>SVM playground</title></head>
          <body><p>Redirecting to the <a href="web/play.html">SVM playground</a>…</p></body></html>
          HTML
          # Publish the built commit so the `gate` job can tell whether a later scheduled tick would be a
          # no-op (site already at HEAD). Served at the site root: https://<pages>/DEPLOYED_SHA.
          echo "$GITHUB_SHA" > "$SITE/DEPLOYED_SHA"
          echo "assembled:"; find "$SITE" -type f | sed "s|$SITE|_site|"

      # Reachability gate (ISSUES.md I26/I42/I49): every asset play.js references must actually be
      # present in the assembled site before it publishes, or the card 404s in production. The asset
      # builds above are fail-soft (dead mirror / missing toolchain ⇒ skipped), so without this a
      # dropped asset ships silently. MAY_BE_ABSENT (DOOM's externally-mirrored WAD) is allowed to
      # degrade to a build-hint card; every other referenced asset missing = red, before deploy.
      - name: verify playground assets reachable
        working-directory: browser
        run: node check-play-assets.mjs --site "$GITHUB_WORKSPACE/_site"

      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
